n:center;margin-bottom:2px}h1+p{text-align:center;font-size:11px;color:#555;margin-top:0;margin-bottom:24px}h2{font-size:13px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.03em}h3{font-size:12.5px;font-weight:700;margin:14px 0 4px}p{margin:0 0 10px;text-align:justify}.assin{margin-top:50px;display:flex;flex-direction:column;gap:34px}.linha{border-top:1px solid #111;padding-top:4px;width:340px;font-size:11px}.disclaimer{margin-top:30px;font-size:10px;color:#777;font-style:italic;border-top:1px solid #ddd;padding-top:10px}@media print{.no-print{display:none}}";var h="<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Contrato — "+es(nome)+"</title><style>"+css+"</style></head><body>"+"<h1>CONTRATO DE PARCERIA CIVIL ENTRE SALÃO-PARCEIRO E PROFISSIONAL-PARCEIRO</h1><p>(Lei nº 12.592/2012, com a redação dada pela Lei nº 13.352/2016 — \"Lei do Salão Parceiro\")</p>"+"<h2>Qualificação das Partes</h2>"+"<p><strong>SALÃO-PARCEIRO:</strong> ANTON KARL RUNGE, pessoa jurídica de direito privado, inscrita no CNPJ sob o nº 32.022.399/0001-06, com sede em RUA BARÃO DE JACAREÍ 525 CENTRO JACAREÍ SP, doravante denominada simplesmente SALÃO-PARCEIRO;</p>"+"<p><strong>PROFISSIONAL-PARCEIRO:</strong> "+es(nome)+", "+es(nac)+", "+es(ec)+", portador(a) do CPF nº "+es(cpf)+" e do RG nº "+es(rg)+", residente e domiciliado(a) em "+es(end)+", profissional de beleza atuante na categoria de "+es(cat)+" (nos termos do art. 1º-A da Lei nº 12.592/2012)"+es(cnpjMei)+", doravante denominado(a) simplesmente PROFISSIONAL-PARCEIRO;</p>"+"<p>As partes acima qualificadas resolvem celebrar o presente CONTRATO DE PARCERIA, de natureza estritamente civil, nos termos da Lei nº 12.592, de 18 de abril de 2012, com a redação dada pela Lei nº 13.352, de 27 de outubro de 2016, mediante as cláusulas e condições a seguir.</p>"+"<h2>Considerandos</h2>"+"<p>CONSIDERANDO que a parceria ora firmada não gera, em nenhuma hipótese, vínculo empregatício entre as partes, tratando-se de relação de natureza civil e associativa, na forma autorizada pela legislação aplicável;</p>"+"<p>CONSIDERANDO que o PROFISSIONAL-PARCEIRO atua com plena autonomia técnica e organizacional na execução dos serviços de sua especialidade, sem subordinação hierárquica ao SALÃO-PARCEIRO;</p>"+"<p>CONSIDERANDO que a relação de parceria deve refletir, em todos os seus aspectos práticos, a realidade aqui pactuada, sob pena de nulidade do presente instrumento e reconhecimento de vínculo empregatício, nos termos da decisão do Supremo Tribunal Federal (ADI 5625) que declarou a constitucionalidade da Lei do Salão Parceiro condicionada à autenticidade da parceria;</p>"+"<h3>CLÁUSULA 1ª — DO OBJETO E DA NATUREZA DA PARCERIA</h3>"+"<p>1.1. O presente contrato tem por objeto estabelecer parceria civil entre as partes para a prestação de serviços de beleza pelo PROFISSIONAL-PARCEIRO a clientes do SALÃO-PARCEIRO, utilizando a estrutura, equipamentos, marca e demais recursos disponibilizados por este, mediante divisão dos valores auferidos, na forma deste contrato.</p>"+"<p>1.2. O PROFISSIONAL-PARCEIRO atuará exclusivamente nas atividades próprias de sua categoria profissional, indicada na qualificação das partes, não podendo ser exigido a exercer funções estranhas a essa categoria (tais como recepção, caixa, limpeza geral, controle de estoque ou gestão administrativa), sob pena de descaracterização da parceria.</p>"+"<p>1.3. Esta parceria não constitui, em nenhuma hipótese, contrato de sociedade, razão pela qual o PROFISSIONAL-PARCEIRO não é sócio do SALÃO-PARCEIRO e não responde pelas obrigações contábeis, fiscais, trabalhistas, previdenciárias ou administrativas da pessoa jurídica do SALÃO-PARCEIRO.</p>"+"<h3>CLÁUSULA 2ª — DO PERCENTUAL DE RETENÇÃO (CLÁUSULA OBRIGATÓRIA)</h3>"+"<p>2.1. Do valor total de cada serviço prestado pelo PROFISSIONAL-PARCEIRO e pago pelo cliente ao SALÃO-PARCEIRO, será destinado o percentual de 90% ao SALÃO-PARCEIRO, a título de retenção pela estrutura, gestão, cobrança e demais serviços de apoio, e o percentual de 10% ao PROFISSIONAL-PARCEIRO, como contraprestação pelos serviços por ele executados.</p>"+"<p>2.2. O percentual acima poderá ser revisto mediante aditivo contratual escrito, assinado por ambas as partes, não se admitindo alteração unilateral ou tácita.</p>"+"<h3>CLÁUSULA 3ª — DOS TRIBUTOS E CONTRIBUIÇÕES (CLÁUSULA OBRIGATÓRIA)</h3>"+"<p>3.1. O SALÃO-PARCEIRO será responsável pela retenção e pelo recolhimento dos tributos e contribuições incidentes sobre a parcela de receita pertencente ao PROFISSIONAL-PARCEIRO, conforme a legislação tributária e previdenciária aplicável ao enquadramento de cada parte.</p>"+"<p>3.2. Cada parte permanece responsável por suas próprias obrigações fiscais perante as respectivas Fazendas Públicas, na forma do seu enquadramento tributário individual.</p>"+"<h3>CLÁUSULA 4ª — DA FORMA E PERIODICIDADE DE PAGAMENTO (CLÁUSULA OBRIGATÓRIA)</h3>"+"<p>4.1. O SALÃO-PARCEIRO centralizará o recebimento dos valores pagos pelos clientes, por qualquer meio de pagamento (dinheiro, PIX, cartão de crédito/débito ou outro), e realizará o repasse da cota-parte do PROFISSIONAL-PARCEIRO com periodicidade mensal, até o dia "+diaPg+" do mês subsequente ao da prestação dos serviços, mediante prestação de contas discriminada dos atendimentos realizados.</p>"+"<p>4.2. Adicionalmente, o SALÃO-PARCEIRO pagará ao PROFISSIONAL-PARCEIRO, a título de ajuda de custo (auxílio-transporte/passagem), o valor de referência de R$ "+fmtR(base)+" (equivalente ao salário-base mensal cadastrado para o(a) profissional no sistema de gestão), acrescido de R$ 50,00 (cinquenta reais) por semana de passagem efetivamente utilizada no período, perfazendo, com base nas "+semanas+" semana(s) informada(s) na ficha, o valor estimado de R$ "+fmtR(valorEstimado)+" no mês de referência. Este valor não substitui nem se confunde com a divisão de receita prevista na Cláusula 2ª, tratando-se de ressarcimento de despesas de deslocamento do profissional até o estabelecimento.</p>"+"<h3>CLÁUSULA 5ª — DO USO DA ESTRUTURA (CLÁUSULA OBRIGATÓRIA)</h3>"+"<p>5.1. O PROFISSIONAL-PARCEIRO terá direito ao uso do espaço físico, equipamentos, utensílios, mobiliário, sistema de agendamento e demais instalações do SALÃO-PARCEIRO necessários à execução de sua atividade profissional, observadas as normas internas de convivência, higiene e organização do estabelecimento.</p>"+"<p>5.2. O uso da estrutura não confere ao PROFISSIONAL-PARCEIRO qualquer direito de posse, propriedade ou exclusividade sobre bens do SALÃO-PARCEIRO.</p>"+"<h3>CLÁUSULA 6ª — DA AUTONOMIA E AUSÊNCIA DE SUBORDINAÇÃO</h3>"+"<p>6.1. O PROFISSIONAL-PARCEIRO organiza sua própria agenda de atendimentos, dentro do horário de funcionamento do estabelecimento, não estando sujeito a controle de ponto, jornada obrigatória, exigência de assiduidade, exclusividade ou subordinação hierárquica típica de relação de emprego.</p>"+"<p>6.2. Fica expressamente vedado ao SALÃO-PARCEIRO impor advertências disciplinares, metas de produtividade obrigatórias, exclusividade de atendimento ou qualquer outra forma de controle incompatível com a autonomia própria da parceria civil ora pactuada.</p>"+"<h3>CLÁUSULA 7ª — DAS RESPONSABILIDADES (CLÁUSULA OBRIGATÓRIA)</h3>"+"<p>7.1. Compete ao SALÃO-PARCEIRO preservar e manter condições adequadas de trabalho, incluindo equipamentos, instalações, segurança e saúde no ambiente de trabalho.</p>"+"<p>7.2. Compete ao PROFISSIONAL-PARCEIRO observar as normas sanitárias aplicáveis à sua atividade, realizando a esterilização e higienização adequada dos materiais e utensílios utilizados no atendimento aos clientes, respondendo por eventuais danos causados por sua conduta profissional.</p>"+"<h3>CLÁUSULA 8ª — DA REGULARIDADE FISCAL DO PROFISSIONAL-PARCEIRO (CLÁUSULA OBRIGATÓRIA)</h3>"+"<p>8.1. O PROFISSIONAL-PARCEIRO obriga-se a manter regular sua inscrição perante as autoridades fazendárias competentes (municipal, estadual e/ou federal, conforme o caso), sendo de sua exclusiva responsabilidade a emissão de documento fiscal correspondente à sua cota-parte, quando exigível.</p>"+"<h3>CLÁUSULA 9ª — DA CENTRALIZAÇÃO DE RECEBIMENTOS E DOCUMENTOS FISCAIS</h3>"+"<p>9.1. O SALÃO-PARCEIRO emitirá documento fiscal unificado ao consumidor, discriminando a parte correspondente ao SALÃO-PARCEIRO e a parte correspondente ao PROFISSIONAL-PARCEIRO, conforme o enquadramento tributário aplicável a cada parte.</p>"+"<h3>CLÁUSULA 10ª — DA VIGÊNCIA E DA RESCISÃO (CLÁUSULA OBRIGATÓRIA)</h3>"+"<p>10.1. O presente contrato entra em vigor na data de sua assinatura, com prazo indeterminado, podendo ser rescindido por qualquer das partes, a qualquer tempo, mediante aviso prévio por escrito com antecedência mínima de 30 (trinta) dias, nos termos do art. 1º-A, § 5º, da Lei nº 12.592/2012.</p>"+"<p>10.2. O contrato poderá, ainda, ser rescindido de imediato, independentemente de aviso prévio, em caso de descumprimento grave de suas cláusulas por qualquer das partes.</p>"+"<h3>CLÁUSULA 11ª — DA AUTENTICIDADE DA PARCERIA E NULIDADE</h3>"+"<p>11.1. As partes reconhecem que a validade deste contrato pressupõe a existência real e efetiva de parceria autônoma entre elas, sem os elementos caracterizadores de vínculo empregatício (subordinação, pessoalidade, não eventualidade e onerosidade típica de salário fixo). A descaracterização da parceria na prática cotidiana poderá ensejar a nulidade deste instrumento e o reconhecimento de vínculo de emprego, nos termos da legislação trabalhista e da jurisprudência do Supremo Tribunal Federal.</p>"+"<h3>CLÁUSULA 12ª — DA HOMOLOGAÇÃO</h3>"+"<p>12.1. Nos termos do art. 1º-A, § 6º, da Lei nº 12.592/2012, o presente contrato deverá ser homologado pelo sindicato da categoria profissional e pelo sindicato da categoria laboral, ou, na ausência destes, pelo órgão local do Ministério do Trabalho e Emprego, na presença de 2 (duas) testemunhas.</p>"+"<h3>CLÁUSULA 13ª — DO FORO</h3>"+"<p>13.1. Fica eleito o foro da comarca de Jacareí SP para dirimir quaisquer controvérsias oriundas do presente contrato, com renúncia expressa a qualquer outro, por mais privilegiado que seja.</p>"+"<p>E, por estarem assim justas e contratadas, as partes assinam o presente instrumento em 2 (duas) vias de igual teor e forma, na presença das testemunhas abaixo.</p>"+"<p>Jacareí/SP, "+dataHoje+"</p>"+"<div class='assin'><div class='linha'>SALÃO-PARCEIRO — ANTON KARL RUNGE</div><div class='linha'>PROFISSIONAL-PARCEIRO — "+es(nome)+"</div><div class='linha'>TESTEMUNHA 1 — Nome / CPF</div><div class='linha'>TESTEMUNHA 2 — Nome / CPF</div></div>"+"<div class='disclaimer'>Este modelo foi preparado com base no resumo da Lei nº 13.352/2016 fornecido pelo usuário e na pesquisa complementar realizada. Recomenda-se fortemente a revisão por advogado(a) trabalhista/civil e por contador(a) antes do uso, especialmente quanto ao percentual de retenção, ao regime tributário aplicável e à homologação sindical exigida por lei — a ausência de homologação é um dos fatores que a legislação aponta como risco de reconhecimento de vínculo empregatício.</div>"+"<br><button class='no-print' onclick='window.print()' style='margin-top:10px;padding:10px 24px;font-size:14px;cursor:pointer;background:#7c3aed;color:#fff;border:none;border-radius:6px'>🖋️ Imprimir / Salvar PDF</button></body></html>";w.document.write(h),w.document.close()}function marcarAuxiliar(name){if(confirm(name+" passa a ser Auxiliar: participa dos atendimentos mas não recebe comissão (o valor fica como saldo do salão). Confirmar?")){var aux=getAuxiliares();(aux=JSON.parse(JSON.stringify(aux)))[name]={promovidoMes:null,promovidoAno:null},PROFS_AUXILIARES_CUSTOM=aux,db.collection("config").doc("profissionaisAuxiliares").set({values:PROFS_AUXILIARES_CUSTOM}),openPLSettings()}}function promoverCabeleireiro(name){var padrao=S.month+1+"/"+S.year,resp=prompt("A partir de qual mês "+name+" passa a receber comissão como Cabeleireiro(a)?\n(Nos meses anteriores continua sem comissão)     var preco='Distribuidor'===it.canal?p.precoDistribuidor||0:'Salão Parceiro'===it.canal?p.precoSalaoParceiro||0:'Cabeleireiro'===it.canal?p.precoCabeleireiro||0:it.precoCustom||0;
    return{prodId:it.prodId,nome:p.label||p.nome||'',qtd:it.qtd||1,canal:it.canal,preco:preco,total:preco*(it.qtd||1),custo:(p.custoPago||0)*(it.qtd||1)};
  });
  return{
    numeroPedido:(document.getElementById('fp-num')||{}).value||_gerarNumeroPedido(),
    nome:(document.getElementById('fp-nome')||{}).value||'',

    cidade:(document.getElementById('fp-cidade')||{}).value||'',

}

    return '<div style="background:#18181b;border:1px solid #27272a;border-radius:8px;padding:12px 14px;margin-bottom:10px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'
      +'<div style="font-size:13px;font-weight:700;color:#f43f5e">'+es(p.numeroPedido||'--')+'</div>'
      +'<span style="font-size:10px;background:'+sc+'22;border:1px solid '+sc+'55;color:'+sc+';border-radius:12px;padding:2px 10px">'+sl+'</span></div>'
      +'<div style="font-size:12px;font-weight:600;color:#f1f5f9">'+es(comp.nome||'--')+'</div>'
      +(comp.tel?'<div style="font-size:11px;color:#71717a">'+es(comp.tel)+'</div>':'')
      +(comp.cpf?'<div style="font-size:10px;color:#52525b">CPF: '+es(comp.cpf)+'</div>':'')
      +(endereco?'<div style="font-size:11px;color:#71717a;margin-bottom:4px">'+es(endereco)+'</div>':'')
      +'<div style="border-top:1px solid #27272a;padding-top:6px;margin:6px 0">'+linhas+'</div>'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">'
      +'<div><strong style="color:#34d399">R$ '+((p.totVenda||0).toFixed(2).replace('.',','))+'</strong>'
      +(p.formaPagamento?'<span style="font-size:10px;color:#71717a;margin-left:8px">'+es(p.formaPagamento)+'</span>':'')
      +(p.vendedor?'<span style="font-size:10px;color:#38bdf8;margin-left:8px">'+es(p.vendedor)+'</span>':'')
      +'</div><div style="font-size:10px;color:#52525b">'+dataF+'</div></div>'
      +(showActions?(function(pp){var pago=(pp.pagamentos||[]).reduce(function(s,pg){return s+(pg.valor||0);},0);var tot=pp.totVenda||0;var pct=tot>0?Math.min(100,Math.round(pago/tot*100)):0;var quitado=pago>=tot-0.01;var pgLista=(pp.pagamentos||[]).slice(-3).reverse().map(function(pg){return '<span style="font-size:10px;color:#a1a1aa">'+new Date(pg.data).toLocaleDateString('pt-BR')+' — R$ '+pg.valor.toFixed(2).replace('.',',')+' ('+es(pg.forma)+')'+(pg.obs?' – '+es(pg.obs):'')+' </span>';}).join('<br>');return '<div style="margin:8px 0;background:#27272a;border-radius:6px;padding:10px 12px">'+'<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px">'+'<span style="color:#a1a1aa">Pagamentos</span>'+'<span><strong style="color:'+(quitado?'#34d399':'#fbbf24')+'">R$ '+pago.toFixed(2).replace('.',',')+' / R$ '+tot.toFixed(2).replace('.',',')+'</strong></span>'+'</div>'+'<div style="background:#3f3f46;border-radius:4px;height:6px;overflow:hidden;margin-bottom:6px">'+'<div style="background:'+(quitado?'#34d399':'#f59e0b')+';height:100%;width:'+pct+'%;border-radius:4px;transition:width .3s"></div>'+'</div>'+(pgLista?'<div>'+pgLista+'</div>':'')+'</div>';})(p):'')+(showActions?'<div style="display:flex;gap:6px;margin-top:10px">'
        +'<button class="gb" style="flex:1;font-size:11px" onclick="var _p=(D.pedidosAR||[]).find(function(x){return x.id===\''+pid+'\';});if(_p)_abrirPdfPedidoAR(_p)">PDF</button>'
        +'<button class="pb" style="flex:2;font-size:11px;padding:7px;background:#34d399;border:none;color:#000;font-weight:700" onclick="confirmarPedidoAR(\''+pid+'\')">Confirmar Venda</button>'
        +'<button class="gb" style="flex:1;font-size:11px" onclick="registrarPagamentoPedidoAR(\''+pid+'\')">&nbsp;💳 Pgto</button>'
        +'<button style="flex:1;font-size:11px;padding:7px;background:#f43f5e22;border:1px solid #f43f5e44;color:#f87171;border-radius:8px;cursor:pointer" onclick="cancelarPedidoAR(\''+pid+'\')">Cancelar</button>'
        +'</div>':'')
      +(CURRENT_USER&&CURRENT_USER.role==='admin'?'<div style="margin-top:6px"><button style="width:100%;font-size:10px;padding:5px;background:#3f3f4622;border:1px solid #3f3f46;color:#a1a1aa;border-radius:6px;cursor:pointer" onclick="excluirPedidoAR(\''+pid+'\')">🗑 Excluir pedido</button></div>':'')
      +'</div>';
  }
  return '<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<div class="ct">Pedidos Pendentes ('+pendentes.length+')</div></div>'
    +(pendentes.length?pendentes.map(function(p){return cardPedido(p,true);}).join(''):'<div class="emp">Nenhum pedido pendente</div>')
    +'</div>'
    +(historico.length?'<div class="cd"><div class="ct">Historico</div>'+historico.map(function(p){return cardPedido(p,false);}).join('')+'</div>':'');
}

function confirmarPedidoAR(id){
  var p=(D.pedidosAR||[]).find(function(x){return x.id===id;});
  if(!p)return showToast('Pedido nao encontrado.','#f43f5e');
  if(!confirm('Confirmar venda do pedido '+p.numeroPedido+'?\n\nIsso vai salvar os itens em Produtos, abater o estoque AR e registrar comissao para '+p.vendedor))return;
  var batch=db.batch();
  (p.items||[]).forEach(function(it){
    var rec={id:uid(),date:hj(),produto:it.nome,quantidade:it.qtd,valorUnitario:it.preco,custo:it.custo,
      cliente:p.comprador&&p.comprador.nome||'',profissional:p.vendedor||'',
      comissaoSalao:0.3,comissaoVendedor:0.1,formaPagamento:p.formaPagamento||'PIX',
      externa:true,pedidoARId:id,numeroPedido:p.numeroPedido,createdBy:CURRENT_USER?CURRENT_USER.role:''};
    batch.set(db.collection('produtos').doc(rec.id),rec);
    if(it.prodId)batch.update(db.collection('arProdutos').doc(it.prodId),{estoque:firebase.firestore.FieldValue.increment(-it.qtd)});
  });
  batch.update(db.collection('pedidosAR').doc(id),{status:'aprovado',dataAprovacao:(new Date).toISOString(),aprovadoPor:CURRENT_USER?CURRENT_USER.nome:''});
  batch.commit().then(function(){showToast('Pedido '+p.numeroPedido+' confirmado! Estoque abatido e comissao registrada.');}).catch(function(e){showToast('Erro: '+e.message,'#f43f5e');});
}

function cancelarPedidoAR(id){
  if(!confirm('Cancelar este pedido?'))return;
  db.collection('pedidosAR').doc(id).update({status:'cancelado'}).then(function(){showToast('Pedido cancelado.');}).catch(function(e){showToast('Erro: '+e.message,'#f43f5e');});
}

function excluirPedidoAR(id){
  var p=(D.pedidosAR||[]).find(function(x){return x.id===id;});
  if(!p)return showToast('Pedido nao encontrado.','#f43f5e');
  function doDelete(){
    var batch=db.batch();
    if(p.status==='aprovado'){
      // pedido ja tinha sido confirmado: remove a venda gerada em Produtos e devolve o estoque debitado
      (D.prd||[]).filter(function(r){return r.pedidoARId===id;}).forEach(function(r){
        batch.delete(db.collection('produtos').doc(r.id));
      });
      (p.items||[]).forEach(function(it){
        if(it.prodId)batch.update(db.collection('arProdutos').doc(it.prodId),{estoque:firebase.firestore.FieldValue.increment(it.qtd||0)});
      });
    }
    batch.delete(db.collection('pedidosAR').doc(id));
    batch.set(db.collection('auditoria').doc(),{
      id:uid(),tipo:'exclusao_pedido_ar',colecao:'pedidosAR',docId:id,
      nomeCliente:(p.comprador&&p.comprador.nome)||'',
      alteradoPor:CURRENT_USER?CURRENT_USER.nome:'',
      alteradoPorRole:CURRENT_USER?CURRENT_USER.role:'',
      dataAlteracao:(new Date).toISOString()
    });
    batch.commit().then(function(){
      showToast('🗑 Pedido excluído'+(p.status==='aprovado'?' e estoque estornado.':'.'));
    }).catch(function(e){showToast('Erro: '+e.message,'#f43f5e');});
  }
  if(CURRENT_USER&&CURRENT_USER.role==='admin'){
    if(!confirm('Excluir definitivamente o pedido '+(p.numeroPedido||'')+'?'+(p.status==='aprovado'?' Isso tambem remove a venda gerada em Produtos e devolve o estoque.':'')))return;
    doDelete();
  }else{
    if(!confirm('Excluir este pedido? Sera necessaria a senha de um administrador.'))return;
    openAdminAuthModal(doDelete);
  }
}


function _waMsgContent(m){
  var url=m.mediaUrl||'',tipo=m.mediaType||'',txt=m.texto||'';
  if(url){
    if(tipo==='image'||/^image/.test(m.mimeType||'')){
      return '<div><img src="'+url+'" style="max-width:260px;max-height:300px;border-radius:8px;cursor:pointer;display:block" onclick="window.open(this.src,\'_blank\')"></div>';
    }
    if(tipo==='audio'||/^audio/.test(m.mimeType||'')){
      return '<audio controls src="'+url+'" style="max-width:260px;outline:none;display:block"></audio>';
    }
    if(tipo==='video'||/^video/.test(m.mimeType||'')){
      return '<video controls src="'+url+'" style="max-width:260px;border-radius:8px;display:block"></video>';
    }
    return '<a href="'+url+'" target="_blank" style="color:#38bdf8;font-size:12px">📎 '+es(txt||m.filename||'Arquivo')+'</a>';
  }
  if(tipo==='image'||txt.indexOf('📷')>=0)return '<div style="background:#27272a;border-radius:8px;padding:10px 14px;text-align:center;color:#71717a;font-size:11px">📷 Imagem recebida</div>';
  if(tipo==='audio'||txt.indexOf('🎵')>=0)return '<div style="background:#27272a;border-radius:8px;padding:10px 14px;text-align:center;color:#71717a;font-size:11px">🎵 Áudio recebido</div>';
  if(tipo==='video'||txt.indexOf('🎥')>=0)return '<div style="background:#27272a;border-radius:8px;padding:10px 14px;text-align:center;color:#71717a;font-size:11px">🎥 Vídeo recebido</div>';
  if(tipo==='document'||txt.indexOf('📎')>=0){var _lbl=m.filename||txt.replace('📎','').trim()||'Arquivo';return '<div style="background:#27272a;border-radius:8px;padding:10px 14px;color:#71717a;font-size:11px">📎 '+es(_lbl)+'</div>';}
  return es(txt);
}


function registrarPagamentoPedidoAR(id){
  var p=(D.pedidosAR||[]).find(function(x){return x.id===id;});
  if(!p)return showToast('Pedido nao encontrado.','#f43f5e');
  var pago=(p.pagamentos||[]).reduce(function(s,pg){return s+(pg.valor||0);},0);
  var restante=(p.totVenda||0)-pago;
  omod(mhdr('Registrar Pagamento — '+es(p.numeroPedido))+
    '<div style="font-size:12px;color:#a1a1aa;margin-bottom:12px">'+
    'Total: <strong style="color:#f1f5f9">R$ '+(p.totVenda||0).toFixed(2).replace('.',',')+
    '</strong> &nbsp;|&nbsp; Pago: <strong style="color:#34d399">R$ '+pago.toFixed(2).replace('.',',')+
    '</strong> &nbsp;|&nbsp; Pendente: <strong style="color:#fbbf24">R$ '+restante.toFixed(2).replace('.',',')+
    '</strong></div>'+
    '<div class="g2"><div class="fi"><label>Valor recebido (R$)</label><input type="number" id="pgto-val" min="0.01" step="0.01" max="'+restante.toFixed(2)+'" placeholder="0,00"></div>'+
    '<div class="fi"><label>Forma de pagamento</label><select id="pgto-forma">'+ol(PGTOS,'PIX')+'</select></div></div>'+
    '<div class="fi"><label>Observação (opcional)</label><input type="text" id="pgto-obs" placeholder="Ex: parcela 1/3, entrada..."></div>'+
    '<button class="pb" style="margin-top:10px" onclick="salvarPagamentoPedidoAR(\''+id+'\')">✅ Registrar Pagamento</button>'
  );
}

function salvarPagamentoPedidoAR(id){
  var val=parseFloat((document.getElementById('pgto-val')||{}).value||'0');
  var forma=(document.getElementById('pgto-forma')||{}).value||'PIX';
  var obs=(document.getElementById('pgto-obs')||{}).value||'';
  if(!val||val<=0)return alert('Informe um valor válido.');
  var novoPagamento={data:new Date().toISOString(),valor:val,forma:forma,obs:obs};
  var p=(D.pedidosAR||[]).find(function(x){return x.id===id;});
  var pagamentos=(p&&p.pagamentos||[]).concat([novoPagamento]);
  var totalPago=pagamentos.reduce(function(s,pg){return s+(pg.valor||0);},0);
  var totVenda=p?p.totVenda||0:0;
  var quitado=totalPago>=totVenda-0.01; // tolerância 1 centavo
  db.collection('pedidosAR').doc(id).update({
    pagamentos:firebase.firestore.FieldValue.arrayUnion(novoPagamento),
    totalPago:totalPago,
    quitado:quitado
  }).then(function(){
    showToast('Pagamento de R$ '+val.toFixed(2).replace('.',',')+' registrado!'+(quitado?' Pedido quitado!':''));
    cmod();
  }).catch(function(e){showToast('Erro: '+e.message,'#f43f5e');});
}


function editarInteresseLead(id){
  if(!CURRENT_USER||'admin'!==CURRENT_USER.role)return;
  var l=(D.leads||[]).find(function(x){return x.id===id;});
  if(!l)return;
  var svcs=getSvcs();
  var opts=svcs.map(function(s){return'<option value="'+es(s)+'">'+es(s)+'</option>';}).join('');
  omod(mhdr('Editar Interesse — '+es(l.nome))+
    '<div class="fi"><label>Interesse principal</label>'+
    '<input type="text" id="ei-int1" value="'+es(l.interesse||'')+'" list="ei-dl"><datalist id="ei-dl">'+opts+'</datalist></div>'+
    '<div class="fi"><label>Interesse adicional (opcional, 1 máximo)</label>'+
    '<input type="text" id="ei-int2" value="'+es(l.interesse2||'')+'" placeholder="Ex: Manutenção, Kit Stop Quebra..." list="ei-dl2"><datalist id="ei-dl2">'+opts+'</datalist></div>'+
    '<input type="hidden" id="ei-lid" value="'+id+'">'+
    '<button class="pb" style="margin-top:12px" onclick="salvarInteresseLead()">💾 Salvar alterações</button>'
  );
}
function salvarInteresseLead(){
  var id=(document.getElementById('ei-lid')||{}).value;
  var int1=((document.getElementById('ei-int1')||{}).value||'').trim();
  var int2=((document.getElementById('ei-int2')||{}).value||'').trim();
  if(!id)return;
  db.collection('leads').doc(id).update({interesse:int1,interesse2:int2||null})
    .then(function(){showToast('Interesse atualizado!');cmod();})
    .catch(function(e){showToast('Erro: '+e.message,'#f43f5e');});
}
function repararLeadsSemId(){
  if(!CURRENT_USER||'admin'!==CURRENT_USER.role)return;
  if(!confirm('Isso vai verificar todos os leads e corrigir apenas o campo interno "id" dos que estiverem com problema (sem apagar nem alterar mais nada). Continuar?'))return;
  db.collection('leads').get().then(function(snap){
    var batch=db.batch(),n=0;
    snap.forEach(function(doc){
      var data=doc.data();
      if(data.id!==doc.id){
        batch.update(doc.ref,{id:doc.id});
        n++;
      }
    });
    if(n===0){showToast('Nenhum lead com ID quebrado encontrado. Tudo certo!');return;}
    batch.commit().then(function(){
      showToast('🔧 '+n+' lead(s) corrigido(s). Agora abrir/excluir deve funcionar normalmente.');
      db.collection('auditoria').add({
        id:uid(),tipo:'reparo_ids_leads',colecao:'leads',docId:'',nomeCliente:'',
        alteracoes:n+' lead(s) com id interno corrigido',
        alteradoPor:CURRENT_USER.nome,alteradoPorRole:CURRENT_USER.role,
        dataAlteracao:(new Date).toISOString()
      });
    }).catch(function(e){showToast('Erro ao corrigir: '+e.message,'#f43f5e');});
  }).catch(function(e){showToast('Erro: '+e.message,'#f43f5e');});
}
function excluirLead(id){
  if(!CURRENT_USER||'admin'!==CURRENT_USER.role)return;
  var l=(D.leads||[]).find(function(x){return x.id===id;});
  if(!l)return;
  if(!confirm('Excluir o lead "'+l.nome+'"?\nEsta ação não pode ser desfeita.'))return;
  db.collection('leads').doc(id).delete()
    .then(function(){showToast('Lead excluído.');cmod();})
    .catch(function(e){showToast('Erro: '+e.message,'#f43f5e');});
}
